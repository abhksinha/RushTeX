# `cargo benchmark`: RushTeX against pdfLaTeX, and the contributor's check (run it from the
# repository root). The testing framework does the work (`parity-testing bench`,
# testing/src/main.rs); cargo builds it when needed. `cargo benchmark --help` lists the modes.
[alias]
benchmark = ["run", "--quiet", "--release", "--manifest-path", "testing/Cargo.toml", "--", "bench"]
