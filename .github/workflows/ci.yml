name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The math glyph tables are taken from New Computer Modern Math of TeX Live 2023
  # (`NEWCM_MATH_FILE` in src/math/fonts/mod.rs): the tests need that exact release.
  NEWCM_URL: https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2023/tlnet-final/archive/newcomputermodern.tar.xz
  NEWCM_SHA256: aaf4451dfa25760bd6e15ae78ecd6f7d4fb99c70baac81982b3575a22c0c579a

jobs:
  build_and_test:
    name: Build, unit tests, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Pinned NewCMMath (TeX Live 2023)
        run: |
          mkdir -p "$HOME/.rushtex/fonts" "$RUNNER_TEMP/newcm"
          curl -fsSL "$NEWCM_URL" | tar -xJ -C "$RUNNER_TEMP/newcm"
          f=$(find "$RUNNER_TEMP/newcm" -name NewCMMath-Regular.otf | head -1)
          echo "$NEWCM_SHA256  $f" | sha256sum -c -
          cp "$f" "$HOME/.rushtex/fonts/"

      - name: Release build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release -- -D warnings

  # Zero-shift parity compares against pdfLaTeX, so it needs the TeX Live the references were
  # made with. Until CI pins one, it reports without gating.
  parity:
    name: Zero-shift parity vs pdfLaTeX (report only)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      - name: TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science lmodern

      - name: Engine format
        run: RT_FMT=target/parity/pdflatex.rfmt RT_FORMAT=pdflatex.ini cargo test --release --lib format_smoke -- --ignored --nocapture

      - name: Zero check, all documents
        run: uv run scripts/parity/parity.py zero --engine --pixels --all
