name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # The frozen native pipeline's math tests read the OpenType math fonts of TeX Live 2023
  # (`NEWCM_MATH_FILE` and kin in src/math/fonts/mod.rs): those exact releases, checksummed.
  TL2023_ARCHIVE: https://ftp.math.utah.edu/pub/tex/historic/systems/texlive/2023/tlnet-final/archive
  # package, its archive's sha256, the math font it holds (the frozen pipeline's font tests)
  MATH_FONTS: |
    newcomputermodern aaf4451dfa25760bd6e15ae78ecd6f7d4fb99c70baac81982b3575a22c0c579a NewCMMath-Regular.otf
    stix2-otf 4bf6540d67c96d1c64e5e9a6919ebfaf083f8eb2a1e9fad0a7a36da8b3df9bf3 STIXTwoMath-Regular.otf
    firamath 778baeecbcc6bd2c55611dcfa6985212d6e759110861fbd19be7f7843542fff3 FiraMath-Regular.otf
    asana-math 611a292d2bd62488ba7c0e56a0a14f28cd1615761699ceae39ba1a4b69e9e6c2 Asana-Math.otf

jobs:
  build_and_test:
    name: Build, unit tests, clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Pinned math fonts (TeX Live 2023) and pdftotext
        run: |
          sudo apt-get install -y --no-install-recommends poppler-utils
          mkdir -p "$HOME/.rushtex/fonts"
          echo "$MATH_FONTS" | while read -r pkg sum font; do
            [ -n "$pkg" ] || continue
            d="$RUNNER_TEMP/$pkg"; mkdir -p "$d"
            curl -fsSL --retry 5 -o "$d.tar.xz" "$TL2023_ARCHIVE/$pkg.tar.xz"
            echo "$sum  $d.tar.xz" | sha256sum -c -
            tar -xJf "$d.tar.xz" -C "$d"
            cp "$(find "$d" -name "$font" | head -1)" "$HOME/.rushtex/fonts/"
          done

      - name: Release build
        run: cargo build --release

      - name: Unit tests
        run: cargo test --release

      - name: Clippy
        run: cargo clippy --release -- -D warnings

      # The product/oracle boundary (native-architecture.md §2, progress.md A0): the product
      # must build, lint and pass its tests without the TeX engine's format, kpathsea and job.
      - name: Product without the oracle
        run: |
          cargo build --release --no-default-features
          cargo clippy --release --no-default-features -- -D warnings
          cargo test --release --no-default-features --lib

  # Zero shift against pdfLaTeX of the pinned TeX Live 2026 (progress.md A1, A1+): the snapshot
  # holds the TeX files the corpus reads, their search paths and the references, made by
  # `scripts/texlive/pin.py pack` and checked by checksum, so no TeX Live is installed here.
  parity:
    name: Zero shift and ownership vs pinned pdfLaTeX
    runs-on: ubuntu-latest
    env:
      PIN_TAG: texlive-2026-pin-1
      PIN_SHA256: dcbdc7c9827a7e8c76495248a3addc0a3e0cf96ee98d4e9d124683788ad20c50
      RUSHTEX_PINNED_REFS: "1"
      SOURCE_DATE_EPOCH: "1792454400"
      FORCE_SOURCE_DATE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      - name: Pinned TeX Live snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$PIN_TAG" -p texlive-2026-pin.tar.xz -D "$RUNNER_TEMP"
          echo "$PIN_SHA256  $RUNNER_TEMP/texlive-2026-pin.tar.xz" | sha256sum -c -
          python3 -I scripts/texlive/pin.py unpack "$RUNNER_TEMP/texlive-2026-pin.tar.xz" "$RUNNER_TEMP/tl" | sed 's/^export //' >> "$GITHUB_ENV"

      - name: Engine format
        run: RT_FMT=target/parity/pdflatex.rfmt RT_FORMAT=pdflatex.ini cargo test --release --lib format_smoke -- --ignored --nocapture

      - name: Zero check, all documents
        run: uv run scripts/parity/parity.py zero --engine --pixels --all

      - name: Leak audit (ownership-check build)
        run: python3 scripts/leak_audit.py
