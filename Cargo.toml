[package]
name = "rushtex"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency TeX subset → PDF compilation engine"
license = "MIT"
publish = false

[[bin]]
name = "rushtex"
path = "src/main.rs"

[lib]
name = "rushtex"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# Model M's checker: freed node blocks are poisoned, and reading or freeing one twice panics.
ownership-check = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
strip = false
panic = "abort"

[profile.bench]
opt-level = 3
debug = true
strip = false

[dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph"] }
