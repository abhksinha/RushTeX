[package]
name = "rushtex"
version = "0.1.0"
edition = "2021"
description = "LaTeX to PDF, identical to pdfLaTeX, in pure safe Rust"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "rushtex"
path = "src/main.rs"

[[bin]]
name = "rushtex-gen"
path = "src/bin/rushtex_gen.rs"
required-features = ["gen"]

[lib]
name = "rushtex"
path = "src/lib.rs"

[features]
# The TeX engine (native-architecture.md §2 layer 7): the LaTeX format's build and load,
# kpathsea lookup and the multi-run job. It compiles every document the native job declines;
# a build without it (`--no-default-features`) has the native job alone.
default = ["oracle", "fonts-core"]
oracle = []
# D2b tier 1: the font programs most documents use, carried in the binary
# (`assets/tables/embed.set`, about 4 MB), so they need no TeX installation.
fonts-core = []
# The table builders (`src/data/`): `rushtex-gen` and tests construct tables; the product
# only reads them.
gen = []
# Model M's checker: freed node blocks are poisoned, and reading or freeing one twice panics.
ownership-check = []
# The macro profiler (`engine_mprof`, `RT_MPROF`): interpreter work by the LaTeX command
# that caused it. Development only; it adds a check per token read.
mprof = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
strip = false
panic = "abort"

# Iterating on a feature (`cargo build --profile iter`): release code without LTO, built
# incrementally in parallel units. Gates, benchmarks and instruction counts use `release`.
[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = false

[profile.bench]
opt-level = 3
debug = true
strip = false

[dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph"] }
