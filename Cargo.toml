[package]
name = "rushtex"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency TeX subset → PDF compilation engine"
license = "MIT"
publish = false

[[bin]]
name = "rushtex"
path = "src/main.rs"

[lib]
name = "rushtex"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
