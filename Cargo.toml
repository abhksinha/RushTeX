[package]
name = "rushtex"
version = "0.1.0"
edition = "2021"
description = "LaTeX to PDF, identical to pdfLaTeX, in pure safe Rust"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "rushtex"
path = "src/main.rs"

[[bin]]
name = "rushtex-gen"
path = "src/bin/rushtex_gen.rs"
required-features = ["gen"]

[lib]
name = "rushtex"
path = "src/lib.rs"

# The TeX Live search's cost: the engine's file search, in the oracle build only.
[[example]]
name = "kpse_cost"
required-features = ["oracle"]

[features]
# The product is the native job alone (2026-11-02): the default build carries the font
# files it reads and needs no TeX installation; a document it declines is an error.
default = ["fonts-core"]
# The TeX engine (native-architecture.md §2 layer 7): the LaTeX format's build and load,
# kpathsea lookup and the multi-run job. Development only, never the product's fallback: the
# oracle for box checks (`scripts/native_probes.sh`), the source the table generators read
# (`rushtex-gen`) and the exactness reference. Build it apart, so the two binaries do not
# rebuild each other: `cargo build --release --features oracle --target-dir target/oracle`.
oracle = []
# D2b tier 1: the core font files (`assets/tables/embed.set`, about 8 MB: Computer Modern,
# AMS, the Latin Modern and cm-super sizes most documents use), carried in the binary, so it
# needs no TeX installation; the rest are font packs (`rushtex fonts install <pack>`).
fonts-core = []
# Every font pack carried in the binary as well (`assets/packs/*.rtpack`, about 12 MB): the
# offline and CI "full" build, which never needs `rushtex fonts install`.
fonts-full = ["fonts-core"]
# The table builders (`src/data/`): `rushtex-gen` and tests construct tables; the product
# only reads them.
gen = []
# Model M's checker: freed node blocks are poisoned, and reading or freeing one twice panics.
ownership-check = []
# The macro profiler (`engine_mprof`, `RT_MPROF`): interpreter work by the LaTeX command
# that caused it. Development only; it adds a check per token read.
mprof = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
strip = false
panic = "abort"

# Iterating on a feature (`cargo build --profile iter`): release code without LTO, built
# incrementally in parallel units. Gates, benchmarks and instruction counts use `release`.
[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
debug = false

[profile.bench]
opt-level = 3
debug = true
strip = false

[dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph"] }
