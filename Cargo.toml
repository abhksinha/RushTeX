[package]
name = "texrs"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency TeX subset → PDF text engine"
license = "MIT"
publish = false

[[bin]]
name = "texrs"
path = "src/main.rs"

[lib]
name = "texrs"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"
