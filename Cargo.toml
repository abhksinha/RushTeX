[package]
name = "rushtex"
version = "0.1.0"
edition = "2021"
description = "Zero-dependency TeX subset → PDF compilation engine"
license = "MIT"
publish = false

[[bin]]
name = "rushtex"
path = "src/main.rs"

[[bin]]
name = "rushtex-gen"
path = "src/bin/rushtex_gen.rs"
required-features = ["gen"]

[lib]
name = "rushtex"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[features]
# The TeX engine as exactness oracle (native-architecture.md §2 layer 7): the LaTeX format's
# build and load, kpathsea lookup and the multi-run job. Default until P7, when native output
# becomes the default and releases build without it.
default = ["oracle", "fonts-core"]
oracle = []
# D2b tier 1: the font programs most documents use, carried in the binary
# (`assets/tables/embed.set`, about 4 MB), so they need no TeX installation.
fonts-core = []
# The table builders (`src/data/`): `rushtex-gen` and tests construct tables; the product
# only reads them.
gen = []
# Model M's checker: freed node blocks are poisoned, and reading or freeing one twice panics.
ownership-check = []
# The macro profiler (`engine_mprof`, `RT_MPROF`): interpreter work by the LaTeX command
# that caused it. Development only; it adds a check per token read.
mprof = []

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
strip = false
panic = "abort"

[profile.bench]
opt-level = 3
debug = true
strip = false

[dev-dependencies]
pprof = { version = "0.14", features = ["flamegraph"] }
