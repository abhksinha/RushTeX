  document.getElementById('stats').textContent = `${vis} of ${n} nodes · ${E.length} edges · ${G.communities} communities${missing ? ` · ${missing} files missing from checkout` : ''}`;
  heat = 1;
}
let heat = 1, dragging = -1, panX = 0, panY = 0, zoom = 1, panning = false, lastMX = 0, lastMY = 0;
function step(){
  if (heat < 0.01) return;
  const k = 60, rep = 2200;
  // Repulsion: all pairs for small graphs, sampled for large ones.
  const sample = n > 1200 ? 48 : n;
  for (let i=0;i<n;i++){
    if(!visible[i]) continue;
    let fx=0, fy=0;
    for (let s=0;s<sample;s++){
      const j = n > 1200 ? (Math.random()*n)|0 : s;
      if (j===i || !visible[j]) continue;
      let dx = X[i]-X[j], dy = Y[i]-Y[j]; let d2 = dx*dx+dy*dy+0.01;
      if (d2 > 160000) continue;
      const f = rep/d2; fx += dx*f; fy += dy*f;
    }
    VX[i] = (VX[i]+fx)*0.5; VY[i] = (VY[i]+fy)*0.5;
  }
  for (const e of E){
    const a=e.src, b=e.dst; if(!visible[a]||!visible[b]) continue;
    if (e.kind==='mentions' && !showmentions.checked) continue;
    let dx = X[b]-X[a], dy = Y[b]-Y[a]; const d = Math.sqrt(dx*dx+dy*dy)+0.01;
    const f = (d-k)*(e.kind==='mentions' ? 0.004 : e.kind==='imports' ? 0.01 : 0.02); dx*=f/d; dy*=f/d;
    VX[a]+=dx; VY[a]+=dy; VX[b]-=dx; VY[b]-=dy;
  }
  for (let i=0;i<n;i++){
    if(!visible[i] || i===dragging) continue;
    VX[i] += (W/2 - X[i])*0.002; VY[i] += (H/2 - Y[i])*0.002;
    X[i] += VX[i]*heat; Y[i] += VY[i]*heat;
  }
  heat *= 0.985;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(panX,panY); ctx.scale(zoom,zoom);
  ctx.lineWidth = 1/zoom;
  for (const e of E){
    if(!visible[e.src]||!visible[e.dst]) continue;
    if (e.kind==='mentions' && !showmentions.checked) continue;
    ctx.strokeStyle = e.kind==='note' ? 'rgba(215,164,73,0.7)' : e.kind==='symbol' ? 'rgba(140,140,160,0.25)' : e.kind==='in' ? 'rgba(98,196,141,0.35)' : e.kind==='imports' ? 'rgba(120,130,150,0.22)' : e.kind==='mentions' ? 'rgba(120,130,150,0.10)' : 'rgba(120,140,180,0.45)';
    ctx.beginPath(); ctx.moveTo(X[e.src],Y[e.src]); ctx.lineTo(X[e.dst],Y[e.dst]); ctx.stroke();
  }
  for (let i=0;i<n;i++){
    if(!visible[i]) continue;
    const nd = N[i]; const r = nd.kind==='note' ? 5 + Math.min(6, nd.degree*0.4) : nd.kind==='file' ? 4 + Math.min(5, nd.degree*0.5) : 2.5;
    ctx.fillStyle = !nd.exists ? '#e06c75' : nd.kind==='note' ? PALETTE[nd.community % PALETTE.length] : nd.kind==='file' ? '#aab4c4' : '#5c6270';
    if (nd.superseded) ctx.globalAlpha = 0.45;
    ctx.beginPath();
    if (nd.kind==='file') ctx.rect(X[i]-r, Y[i]-r, 2*r, 2*r); else ctx.arc(X[i],Y[i],r,0,2*Math.PI);
    ctx.fill(); ctx.globalAlpha = 1;
    if (zoom > 0.8 && (nd.kind!=='symbol' || zoom > 1.6)) {
      ctx.fillStyle = nd.kind==='note' ? '#e8eaf0' : '#9aa3b2'; ctx.font = `${11/zoom}px sans-serif`;
      ctx.fillText(nd.label.length > 42 ? nd.label.slice(0,40)+'…' : nd.label, X[i]+r+3, Y[i]+4/zoom);
    }
  }
  ctx.restore();
}
function loop(){ step(); draw(); requestAnimationFrame(loop); }
function pick(mx,my){
  const x = (mx-panX)/zoom, y = (my-panY)/zoom; let best=-1, bd=100;
  for (let i=0;i<n;i++){ if(!visible[i]) continue; const dx=X[i]-x, dy=Y[i]-y, d=dx*dx+dy*dy; if(d<bd){bd=d;best=i;} }
  return best;
}
const SECTIONS = [[1,'Context'],[2,'Decision'],[4,'Rejected'],[8,'Measured'],[16,'Open']];
function openLink(loc){
  if (!G.root || !loc) return '';
  const [path, line] = loc.split(/:(\d+)$/);
  const url = 'file://' + G.root.replace(/\/$/,'') + '/' + path + (line ? '#L'+line : '');
  return ` <a href="${esc(url)}" title="open in the checkout">open</a>`;
}
function show(i){
  const nd = N[i]; side.style.display='block';
  const by = (kind) => adj[i].filter(j=>N[j].kind===kind);
  let h = `<h2>${esc(nd.label)}</h2><div class="k">${nd.kind} · ${esc(nd.loc || nd.key)}${openLink(nd.loc)}</div>`;
  if (!nd.exists) h += `<div class="miss">${nd.kind==='symbol' ? 'not found in the files its notes name' : 'not in the checkout any more'}</div>`;
  if (nd.kind==='note') {
    h += `<div class="k">${nd.date ? new Date(nd.date*1000).toISOString().slice(0,10) : ''} · ${esc(nd.author)}${nd.superseded ? ' · <span class="sup">superseded</span>' : ''}</div>`;
    if (nd.summary) h += `<p>${esc(nd.summary)}</p>`;
    h += `<div>${SECTIONS.map(([b,name]) => `<span class="chip ${(nd.sections & b) ? 'on' : ''}">${name}</span>`).join('')}</div>`;
  }
  if (G.community_names && G.community_names.length) h += `<div class="k">area: ${esc(G.community_names[nd.community] || '')}</div>`;
  const sec = (title, items) => items.length ? `<div class="k" style="margin-top:8px">${title}</div><ul>${items.map(j=>`<li data-i="${j}" class="${N[j].superseded?'sup':''} ${N[j].exists?'':'miss'}" title="${esc(N[j].summary || N[j].loc || '')}">${esc(N[j].label)}</li>`).join('')}</ul>` : '';
  if (nd.kind==='note') {
    h += sec('files', by('file')) + sec('related notes', by('note')) + sec('symbols', by('symbol'));
  } else if (nd.kind==='file') {
    const imp = adj[i].filter(j => N[j].kind==='file' && E.some(e => e.kind==='imports' && e.src===i && e.dst===j));
    const by_ = adj[i].filter(j => N[j].kind==='file' && E.some(e => e.kind==='imports' && e.src===j && e.dst===i));
    h += sec('notes', by('note')) + sec('imports', imp) + sec('imported by', by_) + sec('defines', adj[i].filter(j => N[j].kind==='symbol' && E.some(e => e.kind==='in' && e.src===j && e.dst===i)));
  } else {
    const users = adj[i].filter(j => N[j].kind==='file' && E.some(e => e.kind==='mentions' && e.src===j && e.dst===i));
    h += (nd.summary ? `<div class="k">${esc(nd.summary)}</div>` : '') + sec('defined in', adj[i].filter(j => N[j].kind==='file' && E.some(e => e.kind==='in' && e.src===i && e.dst===j))) + sec('notes', by('note')) + sec('used in', users.slice(0,40));
  }
  side.innerHTML = h;
  side.querySelectorAll('li').forEach(li => li.onclick = () => { const j = +li.dataset.i; visible[j]=1; show(j); });
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
cv.addEventListener('mousedown', e => { const i = pick(e.clientX,e.clientY); if (i>=0){ dragging=i; } else { panning=true; } lastMX=e.clientX; lastMY=e.clientY; });
addEventListener('mousemove', e => {
  if (dragging>=0){ X[dragging]=(e.clientX-panX)/zoom; Y[dragging]=(e.clientY-panY)/zoom; heat=Math.max(heat,0.3); }
  else if (panning){ panX += e.clientX-lastMX; panY += e.clientY-lastMY; }
  lastMX=e.clientX; lastMY=e.clientY;
});
addEventListener('mouseup', e => { if (dragging>=0 && Math.abs(e.clientX-lastMX)<3) show(dragging); dragging=-1; panning=false; });
cv.addEventListener('click', e => { const i = pick(e.clientX,e.clientY); if (i>=0) show(i); else side.style.display='none'; });
cv.addEventListener('wheel', e => { e.preventDefault(); const f = Math.exp(-e.deltaY*0.001); const mx=e.clientX, my=e.clientY; panX = mx - (mx-panX)*f; panY = my - (my-panY)*f; zoom*=f; }, {passive:false});
q.addEventListener('input', () => { filter = q.value.trim(); recomputeVisible(); });
showsym.onchange = showsup.onchange = showcode.onchange = showmentions.onchange = recomputeVisible;
recomputeVisible(); loop();
</script>
